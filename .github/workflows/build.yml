name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: CPU tests
        run: ctest --test-dir build --output-on-failure
      - name: Build scene probe
        run: cmake --build build --target world11_scene_probe --parallel 2
      - name: Scene and runtime probe
        run: mkdir -p build/probe && cd build && xvfb-run -a ./world11_scene_probe probe
